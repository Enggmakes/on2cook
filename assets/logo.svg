<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="o2cFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E00"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem: Revolutionary Flame + Wave -->
  <g transform="translate(4, 8)">
    <circle cx="24" cy="24" r="23" fill="#141824" stroke="url(#o2cFire)" stroke-width="2"/>
    <!-- Flame Core -->
    <path d="M24 10 C26 16 32 19 32 26 C32 30.5 28.5 34 24 34 C19.5 34 16 30.5 16 26 C16 22 19 18 21 15 C21 18 23 20 25 20 C23 17 23 14 24 10 Z" fill="url(#o2cFire)" filter="url(#flameGlow)"/>
    <!-- Speed/Wave Dual Arc -->
    <path d="M12 24 A 12 12 0 0 1 36 24" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 4"/>
  </g>

  <!-- Typographic Wordmark -->
  <!-- "On" -->
  <text x="64" y="42" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">On</text>
  <!-- "2" (Fiery Accent) -->
  <text x="110" y="42" font-family="'Outfit', -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#o2cFire)">2</text>
  <!-- "Cook" -->
  <text x="132" y="42" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Cook</text>

  <!-- Tagline -->
  <text x="66" y="55" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9BA3B8" letter-spacing="2.2" text-transform="uppercase">AMBASSADOR NETWORK</text>
</svg>
